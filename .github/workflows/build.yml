name: Build KasirToko Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Doctor check
        run: flutter doctor -v

      - name: Get Dependencies
        run: flutter pub get

      - name: Run Unit Tests
        run: flutter test

      - name: Build Android Release APK
        id: build_apk
        run: |
          set -o pipefail
          flutter build apk --release --no-tree-shake-icons --android-skip-build-dependency-validation --verbose 2>&1 | tee build_log.txt

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Diagnostics-Log
          path: build_log.txt
          retention-days: 7

      - name: Push Diagnostics Branch on Failure
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan diagnostics
          git rm -rf . || true
          if [ -f build_log.txt ]; then
            tail -n 400 build_log.txt > build_error.log
            git add build_error.log
            git commit -m "ci: capture build error log"
            git push -f origin diagnostics
          fi

      - name: Prepare APK for Artifact & Release
        run: |
          echo "### Locating generated APK..."
          find build -type f -name "*.apk"
          APK_FILE=$(find build -type f -name "*release*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "::error::No release APK found!"
            exit 1
          fi
          echo "Found APK: $APK_FILE"
          mkdir -p build/app/outputs/flutter-apk
          cp "$APK_FILE" build/app/outputs/flutter-apk/KasirToko-v2.0.0.apk
          echo "## ✅ Build Success!" >> $GITHUB_STEP_SUMMARY
          echo "APK successfully created: \`KasirToko-v2.0.0.apk\` ($(du -h "$APK_FILE" | cut -f1))" >> $GITHUB_STEP_SUMMARY

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KasirToko-Release-APK
          path: build/app/outputs/flutter-apk/KasirToko-v2.0.0.apk
          retention-days: 14

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v2.0.0
          name: "KasirToko Universal POS v2.0.0 - Android Release APK"
          make_latest: true
          body: |
            ## KasirToko Universal Android POS (Offline-First) v2.0.0
            
            Unduh file `KasirToko-v2.0.0.apk` di bawah ini dan pasang langsung di HP atau Tablet Android kasir Anda.
            
            ### Pembaruan Utama v2.0.0:
            - **Konsep Universal POS:** Konfigurasi jenis usaha (Retail & Minimarket, Grosir & Agen, Konter HP & Aksesoris, Toko Elektronik, Jasa Servis, Perdagangan Umum) dengan modul & kategori adaptif tanpa menghapus data lama.
            - **Desain Dashboard Modern & Responsif:** Mendukung HP ringkas (360dp+) hingga Tablet Dual-Pane (layar penuh kasir split catalog + keranjang).
            - **Scanner Barcode Real-Time + Anti-Double-Scan:** Beep hardware & getar, mode beruntun di Kasir, tombol scan satu kali + validasi duplikat barcode di form produk, serta scan QR footer struk di modul Retur.
            - **Modul Jasa Servis HP & Elektronik:** 8 status servis lengkap, penerimaan DP & pelunasan, sinkronisasi stok sparepart ke inventory, riwayat foto kondisi perangkat, cetak nota servis (Thermal/PDF/Dot Matrix) & update ke WhatsApp pelanggan.
            - **Manajemen Printer & Template Struk Lengkap:** Multi-printer adapter (Thermal Bluetooth RFCOMM/USB OTG/LAN TCP/IP, Laser PDF A4, Dot Matrix ESC/P), kontrol laci kasir RJ11, 5 preset template struk + snapshot historis untuk cetak ulang.
            - **Karyawan, Hak Akses Granular & Keamanan:** 7 Role + 15 izin fitur granular, autentikasi PIN maupun Username+Password dengan salted HMAC-SHA256 hashing.
            - **Gudang, Pelanggan, Pembelian & Retur Akurat:** Perbaikan input Qty Surat Jalan & Surat Ambil Barang (`QuantityStepper`), manajemen Pelanggan & Pembelian Supplier, serta batas sisa kuantitas retur & laporan laba kotor multi-satuan akurat.
            
            ### Akun Bawaan (Username / PIN):
            - **Owner:** `owner` / `123456`
            - **Supervisor:** `supervisor` / `3333`
            - **Kasir:** `kasir` / `1111`
            - **Gudang:** `gudang` / `2222`
          files: build/app/outputs/flutter-apk/KasirToko-v2.0.0.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
