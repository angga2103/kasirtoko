name: Build KasirToko Verification (Legacy Trigger Guarded)

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  verify-pr:
    name: Verify Debug APK & Test Suite on Main PR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install SQLite3 for FFI Integration Tests
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-0 libsqlite3-dev

      - name: Get Dependencies
        run: flutter pub get

      - name: Static Analysis
        run: flutter analyze --no-pub --no-fatal-infos

      - name: Run Full Test Suite
        run: flutter test --no-pub -r expanded -j 1

      - name: Build Verified Debug APK
        run: flutter build apk --debug --no-tree-shake-icons --android-skip-build-dependency-validation

      - name: Upload Debug Verification Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KasirToko-Admin-PR-Debug-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
