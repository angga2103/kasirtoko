name: Build KasirToko Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Doctor check
        run: flutter doctor -v

      - name: Get Dependencies
        run: flutter pub get

      - name: Install SQLite3 for FFI Integration Tests
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-0 libsqlite3-dev

      - name: Run Unit & Integration Tests
        run: flutter test -r expanded

      - name: Build Android Release APK
        id: build_apk
        run: |
          set -o pipefail
          flutter build apk --release --no-tree-shake-icons --android-skip-build-dependency-validation --verbose 2>&1 | tee build_log.txt

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Diagnostics-Log
          path: build_log.txt
          retention-days: 7

      - name: Push Diagnostics Branch on Failure
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan diagnostics
          git rm -rf . || true
          if [ -f build_log.txt ]; then
            tail -n 400 build_log.txt > build_error.log
            git add build_error.log
            git commit -m "ci: capture build error log"
            git push -f origin diagnostics
          fi

      - name: Prepare APK for Artifact & Release
        run: |
          echo "### Locating generated APK..."
          find build -type f -name "*.apk"
          APK_FILE=$(find build -type f -name "*release*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "::error::No release APK found!"
            exit 1
          fi
          echo "Found APK: $APK_FILE"
          mkdir -p build/app/outputs/flutter-apk
          cp "$APK_FILE" build/app/outputs/flutter-apk/KasirToko-v2.1.0.apk
          echo "## ✅ Build Success!" >> $GITHUB_STEP_SUMMARY
          echo "APK successfully created: \`KasirToko-v2.1.0.apk\` ($(du -h "$APK_FILE" | cut -f1))" >> $GITHUB_STEP_SUMMARY

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KasirToko-Release-APK
          path: build/app/outputs/flutter-apk/KasirToko-v2.1.0.apk
          retention-days: 14

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v2.1.0
          name: "KasirToko Universal POS v2.1.0 - Production Release APK"
          make_latest: true
          body: |
            ## KasirToko Universal Android POS (Offline-First) v2.1.0

            Unduh file `KasirToko-v2.1.0.apk` di bawah ini dan pasang langsung di HP atau Tablet Android kasir Anda.

            ### Pembaruan Production-Ready v2.1.0:
            - **Autentikasi & Keamanan Login Modern:** Redesain layar login minimalis bebas kebocoran PIN/password bawaan, hashing salted HMAC-SHA256, ganti password/PIN mandiri, dan pemulihan kredensial offline terotorisasi Owner.
            - **Kontrol Kasir (POS) Cepat & Uang Tunai Dinamis:** Tambah/kurang/ketik jumlah item langsung di kotak grid produk dengan validasi `trackStock`, nominal cepat adaptif, dan penegakan wajib Shift Kasir Aktif.
            - **Integritas Keuangan, Kasbon & Pembelian Supplier:** Kasbon khusus pelanggan terdaftar dengan riwayat cicilan, kontrol kecukupan Kas Laci (anti-saldo negatif), buku hutang supplier & pembayaran campuran (`kas_laci`/`transfer`/`hutang`/`campuran`), serta pembatalan (`voidPurchase`) atomik.
            - **Arus Kas, Retur, Stok Opname & Label Barcode:** Rekonsiliasi Arus Kas bebas hitung ganda (transfer internal netral), riwayat retur & batas sisa kuantitas ketat, Stok Opname scan berkelanjutan anti-duplikat, serta cetak stiker Barcode/QR Thermal ESC/POS dan Grid A4 PDF.
            - **Cetak Logo Toko & Opsi Struk:** Dukungan bitmap raster ESC/POS `GS v 0` dan *white-matte compositing* PDF untuk logo PNG transparan serta opsi sembunyikan nama toko saat logo tampil (dengan fallback aman).
            - **Pusat Analitik Bisnis & Audit Trail:** Laporan Penjualan, Produk, Pelanggan, Supplier, dan Keuntungan (HPP & Laba) berbasis query SQLite nyata dengan grafik tren, filter periode lengkap, ekspor PDF & Excel, serta Log Audit *read-only* lengkap dengan filter dan riwayat *before/after*.
          files: build/app/outputs/flutter-apk/KasirToko-v2.1.0.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
